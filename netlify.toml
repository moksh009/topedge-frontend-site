[build]
  command = "yarn build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps --include=optional"
  NPM_CONFIG_PACKAGE_MANAGER = "yarn"
  YARN_FLAGS = ""
  YARN_VERSION = ""
  USE_YARN = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.daily.co https://*.firebaseapp.com https://*.googleapis.com https://*.sentry.io https://assets.calendly.com https://*.youtube.com https://*.ytimg.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://ui-avatars.com https://res.cloudinary.com https://grainy-gradients.vercel.app https://*.daily.co https://*.firebaseapp.com https://*.googleapis.com https://*.wikimedia.org https://*.licdn.com https://*.shutterstock.com https://*.vapi.ai https://*.gifer.com https://*.giphy.com https://*.ytimg.com https://*.facebook.com https://*.fbcdn.net; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.daily.co https://*.firebaseapp.com https://*.googleapis.com https://*.sentry.io https://*.vapi.ai https://api.vapi.ai https://api.cloudinary.com wss://*.daily.co https://topedge-backend.netlify.app https://*.calendly.com https://calendly.com https://*.facebook.com; frame-src 'self' https://*.daily.co https://*.firebaseapp.com https://*.youtube.com https://*.calendly.com https://calendly.com https://*.facebook.com; media-src 'self' https://res.cloudinary.com https://*.daily.co blob: https://*.ytimg.com; manifest-src 'self'; base-uri 'self'; form-action 'self' https://*.facebook.com;"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true
  optimize = true

[context.production.environment]
  NODE_ENV = "production"
  VITE_API_URL = "https://topedge-backend.netlify.app"
