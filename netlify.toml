[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps --include=optional"

# 1. COMMUNITY REDIRECT (Must be FIRST)
[[redirects]]
  from = "/community/*"
  to = "/community.html"
  status = 200
  force = true

# 2. MAIN SPA REDIRECT (Catch-all)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"