[build]
  command = "npm run build:netlify"
  publish = "dist"

# Keep Playwright browsers inside the project so Netlify can cache them across builds
# (avoids re-downloading ~260MB Chromium every deploy).
[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Path redirects live in public/_redirects (copied to dist) so they cannot drift
# from prerender output. Keep host-level apex rule here.
[[redirects]]
  from = "https://www.topedgeai.com/*"
  to = "https://topedgeai.com/:splat"
  status = 301
  force = true

# Long-cache hashed assets + static media (PSI: efficient cache lifetimes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
