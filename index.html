<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7C3AED" />
    <meta property="fb:app_id" content="2889112208140957" />
    <!--
      Page SEO (title, description, canonical, Open Graph, Twitter, JSON-LD)
      is owned exclusively by MarketingSEO / react-helmet-async per route.
      Do NOT put homepage canonical or description here — prerender would
      leave them on every URL and Bing/GSC treat the page as an alternate of /.
    -->
    <style>
      html, body { background: #ffffff; margin: 0; }
      html.dark, html.dark body { background: #000000; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dash.topedgeai.com" crossorigin />
    <!-- media=print + onload keeps fonts out of the critical CSS path (web.dev). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>TopEdge</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>TopEdge, WhatsApp automation for Shopify India. <a href="/pricing">Pricing</a>, <a href="/features">Features</a>, <a href="/blog">Blog</a>, <a href="/contact">Contact</a>.</p>
    </noscript>
  </body>
</html>
